note: >-
  Datavant does not host a changelog page. It ships release notes INSIDE the OpenAPI
  document as a documentation-only tag called "Release Notes", which ReDoc renders as a
  section of the API reference at developer.datavant.com/docs. Entries are grouped by
  resource rather than by release and dated M/D/YY with no version number attached. The
  finding is decay: the newest entry captured is 2023-09-13, while info.version is still
  2023-04-01 - the published change history has not moved in roughly three years even
  though the API is live and serving.
