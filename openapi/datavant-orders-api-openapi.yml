        name: version-datavant
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHTTPResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHTTPResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHTTPResponse'
  /orders/{order_id}/reporting/retrievals:
    get:
      summary: Get reporting for order retrievals
      description: Fetch retrieval numbers for order.
      operationId: get_order_retrievals_reporting_data_orders__order_id__reporting_retrievals_get
      parameters:
      - required: true
        schema:
          type: string
          title: Order Id
        name: order_id
        in: path
      - required: false
        schema:
          type: boolean
          title: Breakdown
          default: true
        name: breakdown
        in: query
      - required: false
        schema:
          type: boolean
          title: Snowflake
          default: false
        name: snowflake
        in: query
      - description: Version of the Orders API to use with this call
        required: false
        schema:
          type: string
          title: Version-Datavant
