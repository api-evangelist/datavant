          - $ref: '#/components/schemas/Patient'
          title: Patient
          description: Patient for the visit.
        encounter:
          allOf:
          - $ref: '#/components/schemas/Encounter'
          title: Encounter
          description: Encounter for the visit.
        retrieval_details:
          allOf:
          - $ref: '#/components/schemas/VisitRetrievalDetails'
          title: Retrieval Details
