    OrderStatus:
      type: string
      enum:
      - draft
      - accepted
      - rejected
      - processing
      - failed
      - dispatched
      - canceled
      - complete
      - pending_close
      - close_in_progress
      - intake_review_required
      - intake_review_completed
      title: OrderStatus
      description: "OrderStatus is an enumeration representing the different stages in an order's lifecycle.\n\
        \nDefinitions:\n    draft: An initial state for orders that are created but not yet submitted\
        \ for processing.\n        - Used for orders created manually through the IDSB UI, requiring explicit\
        \ action to proceed to dispatch.\n\n    accepted: A ready-for-processing state for newly received\
        \ orders.\n        - Used for orders submitted via the CF orders API, indicating they are queued\
        \ for dispatch without requiring further manual intervention.\n\n    intake_review_required: An\
        \ action required state to complete steps prior to dispatching instructions.\n        - Used for\
        \ orders that require action items to be completed as part of the import review process.\n\n \
        \   intake_review_completed: A state indicating that the import review process has been completed.\n\
        \        - Used for orders that have completed the import review process and are ready for dispatch.\n\
        \n    rejected: A terminal state indicating the order was declined.\n        - Used for prematch\
        \ when an order fails input file validation\n\n    processing: A temporary state while initial\
        \ processing actions are performed on the order.\n        - Used after submission but before any\
        \ external requests are dispatched, including internal steps like intake database updates, routing,\n\
        \          and merging charts (for semi-auto/ML sweep).\n\n    failed: A terminal state indicating\
        \ the order failed to process.\n        - Used for prematch orders to indicate order failed to\
        \ process.\n\n    dispatched: A state indicating that external chart or patient searches have\
        \ been initiated.\n        - Set once the first external request related to the order is sent\
        \ out.\n\n    canceled: A terminal state indicating the order was withdrawn and processing has\
        \ ceased.\n\n    complete: A terminal state signifying that the order has been fully processed\
        \ and closed.\n        - Currently set manually after all retrievals and chart deliveries are\
        \ finalized.\n\n    pending_close: A terminal state indicating that further processing should\
        \ halt.\n        - This state mirrors CF updates instructing IDSB to stop any remaining work on\
        \ the order.\n\n    close_in_progress: A temporary state during which the order is being closed.\n\
        \        - Set when a close request is initiated. Closing actions are underway, and status will\
        \ transition to 'complete' once finalized.\n\n    Order status lifecycle for IDSB fully automated\
        \ projects:\n        - draft -> processing -> dispatched -> close_in_progress -> complete\n\n\
        \    Order status lifecycle for IDSB semi-automated projects:\n        -  accepted -> dispatched\
        \ -> complete\n\n    Order status lifecycle for IDSB traditional projects:\n        - draft ->\
        \ accepted -> processing -> intake_review_required -> intake_review_completed -> dispatched ->\
        \ complete"
