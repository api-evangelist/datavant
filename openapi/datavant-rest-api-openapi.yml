tags:
- name: Configuration
  description: '

    This is an object representing account settings and default order preferences associated with your
    account.

    '
- name: Projects
  description: '

    A project is an optional entity that allows you to group multiple orders together and apply consistent

    configuration to all nested orders.

    '
- name: Orders
  description: '

    An order is the parent container for incoming queries. An order contains one or more queries along

    with other identifying information (e.g., type, reason, etc.)

    '
- name: Order Queries
  description: '

    An order query is a request for medical records for a specific patient, but the exact encounter criteria
    are unknown and/or are flexible.

    It''s possible, depending on the encounter criteria, that one or more patient searches and/or chases
    will result from an order query.

    '
- name: Visits
  description: '

    A visit is a record of the actions performed by Datavant to obtain charts from a specific clinic within
    the specified date ranges for a specific patient.

    '
- name: Documents
  description: '

    Interact with the various documents that are collected and/or generated by Datavant through the identified

    patient record retrieval process including patient medical records and supporting documents.

    '
- name: Release Notes
  description: '


    ### Configuration

    - 4/27/23 - Added `configuration/supporting-documents/health-plan-letter` for managing Health Plan
    Letters


    ### Orders

    - 9/13/23 - Added `/{order_id}/validation/stats` for high-level validation stats for the given order

    - 8/22/23 - Added manual QA and coding required configuration options to Orders

    - 5/18/23 - Added `alternate_delivery` configuration to Orders

    - 4/19/23 - Added `delivery_location` configuration to Orders


    ### Visits

    - 8/21/23 - Added `projects/{project_id}/queries/{query_id}/visits/{visit_uuid}` to return details
    for a specific visit

    - 8/21/23 - Added `projects/{project_id}/queries/{query_id}/visits` to return all visits for a specific
    query


    ### Documents

    - 6/16/23 - Added indicator for when a chart has been downloaded

    - 5/12/23 - Added `404 - Document does not exist` when Document not found

    - 5/11/23 - Added `/documents` endpoint to list all documents associated with Order or Order Query



    <a href="mailto:support@datavant.com" rel="noopener noreferrer" class="link">Contact the developer</a>

    '
