openapi: 3.1.0
info:
  title: Datavant REST API
  description: '

    Datavant''s REST API is a full-featured API built to facilitate programmatic access to our

    identified patient medical record retrieval capabilities. We provide predictable resource-oriented,

    JSON-encoded APIS protected by industry-standard OAuth2 ClientCredential authentication.

    '
  version: '2023-04-01'
paths:
  /orders/:
    get:
      tags:
      - Orders
      summary: List all orders
      description: 'Get a paginated list of all orders for the given tenant,

        excluding deleted and prematch orders'
      operationId: list_orders_orders__get
      parameters:
      - required: false
        schema:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 50
        name: limit
        in: query
      - required: false
        schema:
          type: integer
          minimum: 0.0
          title: Offset
          default: 0
        name: offset
        in: query
      - required: false
        schema:
          type: string
          title: Sort By
        name: sort_by
        in: query
      - required: false
        schema:
          type: string
          title: Sort Dir
        name: sort_dir
        in: query
      - required: false
        schema:
          type: string
          title: Project Name
        name: project_name
        in: query
      - required: false
        schema:
          type: string
          title: Order Name
        name: order_name
        in: query
      - required: false
        schema:
          type: string
          title: Secondary Reason
        name: secondary_reason
        in: query
      - required: false
        schema:
          type: string
          title: Status
        name: status
        in: query
      - description: Version of the Orders API to use with this call
        required: false
        schema:
          type: string
          title: Version-Datavant
          description: Version of the Orders API to use with this call
          default: '2023-04-01'
        name: version-datavant
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiPage_OrderResponse_'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHTTPResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHTTPResponse'
    post:
      tags:
      - Orders
      summary: Create an order
      description: 'Create an Order.

        Returns HTTP_409_CONFLICT if order with the same ID already exists for the given customer ID.'
      operationId: create_order_orders__post
      parameters:
      - description: Version of the Orders API to use with this call
        required: false
        schema:
          type: string
          title: Version-Datavant
          description: Version of the Orders API to use with this call
          default: '2023-04-01'
        name: version-datavant
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHTTPResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHTTPResponse'
        '409':
          description: Order with specified ID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHTTPResponse'
  /orders/order:
    get:
      summary: Get an order
      description: 'Fetch the details of a specific order.


        Either ''id'' or ''uuid'' must be provided.'
      operationId: get_order_by_specific_id_orders_order_get
