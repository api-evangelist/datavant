components:
  schemas:
    Address:
      properties:
        normalizations:
          items: {}
          type: array
          title: Normalizations
          default: []
        line1:
          type: string
          title: Line1
          description: Street address
        line2:
          type: string
          title: Line2
          description: Building, Suite#, Unit#, etc..
        city:
          type: string
          title: City
          description: City
        country:
          type: string
          title: Country
          description: Country Code, ISO 3166-1 alpha-2 code
          default: US
        state:
          type: string
          title: State
          description: State/Province Abbreviation Code, 2 characters
        postal_code:
          type: string
          title: Postal Code
          description: Postal Code, US - 5 digits or 5+4, Other - Alphanumeric
      type: object
      title: Address
      description: 'A custom BaseModel with the eventual goal of populating inheriting models with the
        value property

        of enums rather than the raw enum.


        For now this is set to False (default setting) and we only set enum values to true within the

        models that have enums we know we need to use the values for.'
    AllDeliveryConfig:
      properties:
        pdf:
          $ref: '#/components/schemas/PdfDeliveryConfig'
        cda:
          $ref: '#/components/schemas/BaseDeliveryConfig'
        fhir:
          $ref: '#/components/schemas/BaseDeliveryConfig'
        structured_extraction:
          $ref: '#/components/schemas/StructuredExtractionDeliveryConfig'
        chart_detail_extract:
          $ref: '#/components/schemas/ChartDetailExtractDeliveryConfig'
      type: object
      title: AllDeliveryConfig
      description: Model for the delivery configuration.
    AllowBlockGroup:
      properties:
        data_foundation_health_system_ids:
          items:
            type: string
          type: array
          title: Data Foundation Health System Ids
          description: The set of Data Foundation health system IDs that are allowed or blocked.
      type: object
      title: AllowBlockGroup
      description: 'A custom BaseModel with the eventual goal of populating inheriting models with the
        value property

        of enums rather than the raw enum.


        For now this is set to False (default setting) and we only set enum values to true within the

        models that have enums we know we need to use the values for.'
