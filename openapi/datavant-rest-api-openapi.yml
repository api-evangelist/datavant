          description: The alternate entity to deliver to.
          discriminator:
            propertyName: method
            mapping:
              mail: '#/components/schemas/Mail'
              sftp: '#/components/schemas/Sftp'
        use_only_alternate:
          type: boolean
          title: Use Only Alternate
          description: Whether to deliver only to the alternate entity.
          default: false
      type: object
      title: AlternateDelivery
      description: Delivery to an alternate entity separate from the primary requester.
