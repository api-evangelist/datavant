note: >-
  trust.datavant.com resolves and returns HTTP 200, but the page is a client-rendered
  single-page app: the HTML shell contains only a loader, and every content path
  (/home, /api/v1/company, /trustshare/program-content/*) returns the same shell. The
  underlying TrustShare content API (backend.trustcloud.ai) answers 401 Unauthorized
  without a token, so the certification list, policy documents and subprocessor register
  cannot be read anonymously - most TrustShare tenants gate document download behind an
  NDA click-through. The certifications recorded below are therefore taken from Datavant's
  OWN first-party public statements rather than from the trust center itself, and each one
  carries the URL it was read from. This is a real trust center whose contents are not
  machine-readable.
