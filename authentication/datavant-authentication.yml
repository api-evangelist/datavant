generated: '2026-08-14'
method: searched
source: openapi/datavant-rest-api-openapi.yml
docs: https://developer.datavant.com/docs
note: >-
  Derived from the OpenAPI securitySchemes, then upgraded from two live anonymous probes:
  the OAuth 2.0 token operation documented in the specification itself (POST /oauth2/token,
  "Authenticate with Orders API using Client Credentials"), and Datavant's Auth0 discovery
  documents served at auth.datavant.com. The REST API and the Datavant Portal are two
  different authentication surfaces backed by the same identity provider tenant
  (https://datavant.auth0.com/): the REST API uses OAuth 2.0 client credentials against
  https://api.datavant.io/v2/oauth2/token, while the Portal and the Datavant CLI use a
  long-lived generated application credential issued from the Portal Download page.
summary:
  types:
    - oauth2
    - openIdConnect
  oauth2_flows:
    - clientCredentials
  api_key_in: []
  bearer_token: true
  identity_provider: Auth0 (tenant https://datavant.auth0.com/, custom domain auth.datavant.com)
schemes:
  - name: oauth2
    type: oauth2
    applied: global
    flows:
      - flow: clientCredentials
        tokenUrl: https://api.datavant.io/v2/oauth2/token
        refreshUrl: https://api.datavant.io/v2/oauth2/token
        scopes: 0
        note: >-
          The specification declares an EMPTY scopes map and no operation narrows
          `security[]`, so every operation carries the same undifferentiated
          `oauth2: []` requirement. There is no per-operation authorization surface
          published.
    sources:
      - openapi/datavant-rest-api-openapi.yml
  - name: openIdConnect
    type: openIdConnect
    openIdConnectUrl: https://auth.datavant.com/.well-known/openid-configuration
    issuer: https://datavant.auth0.com/
    applied: portal
    note: >-
      Not declared in the REST API specification. Probed live and captured verbatim to
      well-known/datavant-openid-configuration.json; it backs the Datavant Portal and the
      identity layer around the API rather than the REST operations themselves.
    sources:
      - well-known/datavant-openid-configuration.json
token_request:
  method: POST
  url: https://api.datavant.io/v2/oauth2/token
  content_type: application/json
  body_fields:
