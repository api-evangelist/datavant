  token_type: bearer
  expires_in_seconds: 7200
  source: openapi/datavant-rest-api-openapi.yml#/paths/~1oauth2~1token
authorization_server_metadata:
  discovery:
    openid_configuration: https://auth.datavant.com/.well-known/openid-configuration
    oauth_authorization_server: https://auth.datavant.com/.well-known/oauth-authorization-server
