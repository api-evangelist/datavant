  id_token_signing_alg_values_supported_note: RS256 (Auth0 default; see the captured discovery document)
other_credentials:
  - surface: Datavant Portal / Datavant CLI
    mechanism: generated application credential (credentials.txt), piped to the CLI on stdin or supplied via the DV_USER_CREDENTIALS environment variable
    lifetime: 10 years
    issued_from: Datavant Portal Download page (login-gated)
    note: >-
      This is a separate credential from the REST API OAuth client. It is generated once
      and cannot be viewed again; account admins are emailed before expiry.
    source: https://aws.amazon.com/marketplace/pp/prodview-eolcfagze2ihw
gaps:
  - No scopes are published for the REST API, so an agent cannot request least privilege.
  - No mTLS, no API-key scheme, and no DPoP / proof-of-possession is declared.
  - No token-introspection or revocation endpoint is documented for the REST API token issuer.
