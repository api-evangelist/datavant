name: Datavant
kind: company
description: >-
  Datavant is a United States health-data logistics company, formed from the 2021
  merger of Datavant and Ciox Health, that connects and de-identifies healthcare data
  across a "network of networks" spanning 350+ real-world data partners, 80,000+
  hospitals and clinics, and a majority of the largest US health systems. Its core
  capabilities are privacy-preserving record linkage using Datavant tokens, HIPAA
  Expert Determination and de-identification, medical record retrieval / release of
  information, and real-world evidence generation for life sciences, payers, providers,
  and government. Datavant's integration surface is enterprise and partner/contract
  gated - an access-controlled API host exists at api.datavant.com (returns HTTP 403
  to anonymous callers) but Datavant does not publish a self-serve public developer
  portal, a downloadable OpenAPI specification, or a FHIR CapabilityStatement. Home
  market is the United States.
