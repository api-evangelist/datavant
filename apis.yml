apis:
- name: Datavant REST API
  description: 'Datavant''s REST API for identified patient medical record retrieval - the programmable
    side of Datavant Connect Retrieval (the ex-Ciox release-of-information business). Resource-oriented,
    JSON-encoded, protected by OAuth 2.0 client credentials. 36 paths and 54 operations across seven
    resources: Configuration (tenant defaults), Projects (order grouping), Orders (the parent container),
    Order Queries (one per patient), Prematch (population sizing before committing to retrieval),
    Visits (the retrieval work performed at each clinic) and Documents (the charts that come back).
    Collections page with limit/offset in a JSON:API-flavoured envelope; versioning is a /v2 path
    segment plus an optional version-datavant date header defaulting to 2023-04-01. No scopes, no
    rate limits, no idempotency key and no webhooks are published.'
  humanURL: https://developer.datavant.com/docs
  baseURL: https://api.datavant.io/v2
