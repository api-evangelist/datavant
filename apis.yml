aid: datavant
url: https://raw.githubusercontent.com/api-evangelist/datavant/refs/heads/main/apis.yml
name: Datavant
kind: company
description: 'Datavant is a United States health-data logistics company, formed from the 2021 merger
  of Datavant and Ciox Health, that connects and de-identifies healthcare data across a "network
  of networks" spanning 350+ real-world data partners, 80,000+ hospitals and clinics, and a majority
  of the largest US health systems. Its core capabilities are privacy-preserving record linkage using
  Datavant tokens, HIPAA Expert Determination and de-identification, medical record retrieval / release
  of information, and real-world evidence generation for life sciences, payers, providers, and government.
  Datavant publishes a real machine-readable contract for the retrieval side of that business: an
  OpenAPI 3.1.0 document for the Datavant REST API (36 paths, 54 operations, OAuth 2.0 client credentials,
  base https://api.datavant.io/v2) is served anonymously at https://developer.datavant.com/openapi.json,
  even though that host''s root returns HTTP 404. Access is still enterprise and contract-gated -
  there is no self-serve sign-up, no published pricing beyond a single AWS Marketplace listing, no
  published scopes or rate limits, and no FHIR CapabilityStatement. Home market is the United States.'
