note: Entity-relationship graph derived from the components.schemas $ref graph and id-reference field
  names in the Datavant REST API OpenAPI. The API is organised around four addressable root resources
  - Configuration (per-tenant account settings), Project (optional grouping), Order (the parent container
  for record-retrieval requests) and its nested Order Queries - with Visits and Documents as the retrieval
  outputs. Collections are wrapped in a JsonApiPage_<T>_ envelope (JSON:API 1.0 `data` key plus total/limit/offset/links).
roots:
- entity: ConfigurationResponse
  path: /configuration/
  key: tenant
  note: One configuration per tenant/customer; no id in the path.
- entity: ProjectResponse
  path: /projects/
  key: project_id
  alt_key: project_uuid
  note: Optional grouping applying consistent configuration to nested orders.
- entity: OrderResponse
  path: /orders/
  key: order_id
  alt_key: order_uuid
  note: Parent container for one or more order queries.
- entity: OrderQueryResponse
  path: /orders/{order_id}/queries
  key: query_id
  alt_key: query_uuid
  note: A request for records for one patient; belongs_to Order.
- entity: Visit
  path: /projects/{project_id}/queries/{query_id}/visits
  key: visit_uuid
  note: Actions performed to obtain charts from a clinic for a patient.
- entity: DocumentResponse
  path: /documents
  key: document_uuid
  note: Documents collected/generated through the retrieval process.
- entity: PrematchOrderResponse
  path: /orders/prematch
  key: order_uuid
  note: Prematch orders are excluded from the main /orders/ listing.
pagination_envelopes:
- JsonApiPage_DocumentResponse_
- JsonApiPage_FilenameResponse_
- JsonApiPage_OrderQueryResponse_
- JsonApiPage_OrderResponse_
- JsonApiPage_Visit_
