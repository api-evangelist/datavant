  real OIDC discovery document (issuer https://datavant.auth0.com/), the RFC 8414 OAuth
  authorization-server metadata (byte-identical to the OIDC document), and a live JWKS.
  No security.txt, api-catalog, ai-plugin.json, agent-card.json, agent.json,
  oauth-protected-resource or SMART-on-FHIR configuration is served on any host.
