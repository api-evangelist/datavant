note: >-
  Datavant publishes a live Atlassian Statuspage and versions the REST API twice (a /v2
  path segment plus a date-stamped `version-datavant` request header defaulting to
  2023-04-01), but publishes no deprecation policy, no sunset commitment, and no SLA that
  can be read anonymously. No operation in the specification is marked `deprecated: true`.
versioning:
  scheme: uri-path + date-header
  current: v2
  current_date_version: '2023-04-01'
  header: version-datavant
  header_default: '2023-04-01'
  docs: https://developer.datavant.com/docs
  note: >-
    servers[] is https://api.datavant.io/v2. Each operation additionally accepts an
    optional `version-datavant` header described as "Version of the Orders API to use with
    this call". Datavant does not publish the list of valid date versions, so a client
    cannot discover which versions besides 2023-04-01 are accepted.
